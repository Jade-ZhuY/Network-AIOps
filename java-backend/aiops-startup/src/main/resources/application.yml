server:
  address: 127.0.0.1
  port: ${AIOPS_JAVA_PORT:18081}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  application:
    name: network-aiops-business
  datasource:
    url: ${AIOPS_JAVA_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/network_aiops_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AIOPS_JAVA_DATABASE_USERNAME:root}
    password: ${AIOPS_JAVA_DATABASE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    jdbc-type-for-null: NULL
workspace:
  auth:
    engineer-token: ${AIOPS_JAVA_AUTH_ENGINEER_TOKEN:}
    admin-token: ${AIOPS_JAVA_AUTH_ADMIN_TOKEN:}
  agent:
    enabled: ${AIOPS_AGENT_ENABLED:false}
    base-url: ${AIOPS_AGENT_BASE_URL:http://127.0.0.1:8080}
    connect-timeout: 3s
    read-timeout: 185s
    max-response-bytes: 8388608
  analysis:
    max-concurrent: ${AIOPS_ANALYSIS_MAX_CONCURRENT:2}
    queue-capacity: ${AIOPS_ANALYSIS_QUEUE_CAPACITY:50}
  frontend-path: ${AIOPS_FRONTEND_PATH:../app/web/dist}
logging:
  file:
    name: ${AIOPS_JAVA_LOG_PATH:.local/logs}/network-aiops.log
  charset:
    console: UTF-8
    file: UTF-8
  threshold:
    console: ${AIOPS_JAVA_CONSOLE_LOG_LEVEL:TRACE}
  pattern:
    level: "%5p [requestId=%X{requestId:-internal}]"
  logback:
    rollingpolicy:
      file-name-pattern: ${AIOPS_JAVA_LOG_PATH:.local/logs}/archive/network-aiops.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 512MB
      clean-history-on-start: true
  level:
    root: ${AIOPS_JAVA_LOG_LEVEL:INFO}
    org.springframework.security: WARN
